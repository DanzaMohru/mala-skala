# Zkušební sestavení webu ve větvi "prestavba".
# Sestaví web stejným nástrojem jako GitHub Pages a výsledek uloží ke stažení.
# Na živý web nemá vliv. Před spuštěním nové verze se tento soubor smaže.
name: Zkusebni sestaveni
on:
  push:
    branches: [prestavba]
  workflow_dispatch:
jobs:
  sestaveni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: _site
